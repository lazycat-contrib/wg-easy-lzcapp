version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wg-easy

build:
  run_buildscript: false

images:
  - id: wg-easy
    target: service
    service: wg-easy
    source: ghcr.io/wg-easy/wg-easy
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: WireGuard Easy
      source: https://github.com/wg-easy/wg-easy
      source_author: wg-easy
  private:
    enabled: true
    skip_if_version_exists: true
    name: WireGuard Easy
    summary: 由 GitHub Actions 自动发布
